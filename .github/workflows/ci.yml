name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q .
      - run: bandit -q -r . -x ./tests,./data,./logs
      - run: BOT_ENV_FILE=.env.example docker compose --env-file .env.example config --quiet
      - run: docker build --check .
      - run: docker build -t qbittorrent-telegram-bot:test .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan complete Git history with Gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.30.0
          git /repo --config /repo/.gitleaks.toml --no-banner --redact
